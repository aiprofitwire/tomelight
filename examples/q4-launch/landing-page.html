<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q4 Launch Landing Page</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0b0f19;color:#e8ecf5}
.hero{min-height:88vh;display:grid;place-items:center;text-align:center;padding:48px 24px;background:radial-gradient(ellipse at 50% 0%,#1d3a6b 0%,#0b0f19 60%)}
.pill{display:inline-block;padding:6px 14px;border:1px solid #2c4a7a;border-radius:99px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#8fb4ff}
h1{font-size:clamp(40px,7vw,84px);line-height:1;margin:22px 0 14px;letter-spacing:-.03em}
h1 span{background:linear-gradient(90deg,#7ee8fa,#80ff72);-webkit-background-clip:text;color:transparent}
p{font-size:20px;color:#a7b3cc;max-width:560px;margin:0 auto 30px}
button{font:600 17px inherit;padding:14px 28px;border-radius:12px;border:0;background:#7ee8fa;color:#06222a;cursor:pointer}
#count{margin-top:26px;font-variant-numeric:tabular-nums;color:#8fb4ff;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;max-width:980px;margin:0 auto;padding:60px 24px}
.card{background:#121a2b;border:1px solid #1f2b44;border-radius:16px;padding:22px}.card b{display:block;font-size:18px;margin-bottom:6px}
</style></head><body>
<section class="hero"><div><span class="pill">Launching October 26</span><h1>Your week, <span>back.</span></h1>
<p>The planning tool that turns scattered notes into one clear plan.</p><button onclick="this.textContent='You are on the list'">Join the waitlist</button>
<div id="count"></div></div></section>
<section class="grid"><div class="card"><b>One plan</b>Every task in one place.</div><div class="card"><b>Zero setup</b>Works with the files you already have.</div><div class="card"><b>Private</b>Nothing leaves your computer.</div></section>
<script>const t=new Date('2026-10-26T09:00:00');const el=document.getElementById('count');const tick=()=>{const d=Math.max(0,t-new Date());const days=Math.floor(d/864e5),h=Math.floor(d/36e5)%24,m=Math.floor(d/6e4)%60;el.textContent=days+' days '+h+' hours '+m+' minutes to launch';};tick();setInterval(tick,1000);</script>
</body></html>
