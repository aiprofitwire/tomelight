name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build Apple Silicon and Intel apps
        run: |
          npm run package
          node scripts/package.mjs --x64
      - name: Zip
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-release
          for ARCH in arm64 x64; do
            ditto -c -k --sequesterRsrc --keepParent "release/Tomelight-darwin-$ARCH/Tomelight.app" "dist-release/Tomelight-mac-$ARCH.zip"
          done
          cd dist-release && shasum -a 256 *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-release/*
          draft: true
          generate_release_notes: true
